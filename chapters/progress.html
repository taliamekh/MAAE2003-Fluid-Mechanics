<section id="progress" class="page-section">
  <h1 class="page-title" style="color:var(--eq)">Progress Tracker</h1>
  <p class="page-subtitle">Track your study progress across all course content</p>

  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
    <div style="flex:1;">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <span id="progress-pct" style="font-size:14px;font-weight:600;color:var(--eq);min-width:36px;">0%</span>
  </div>

  <h2 style="color:var(--ch1-title);">Ch 1: Fluid Properties & Pressure</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-ch1-lec1"><label for="p-ch1-lec1">1.1 Introduction</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch1-lec2"><label for="p-ch1-lec2">1.2 Units & Fluid Properties</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch1-lec3"><label for="p-ch1-lec3">1.3 Hydrostatics & Manometers</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch1-lec4"><label for="p-ch1-lec4">1.4 Pressure</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch1-prob"><label for="p-ch1-prob">Ch 1 Problems</label></div>
  </div>

  <h2 style="color:var(--ch2-title);">Ch 2: Hydrostatic Forces & Buoyancy</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-ch2-lec1"><label for="p-ch2-lec1">2.1 Forces on Plane Surfaces</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch2-lec2"><label for="p-ch2-lec2">2.2 Forces on Curved Surfaces</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch2-lec3"><label for="p-ch2-lec3">2.3 Buoyancy</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch2-prob"><label for="p-ch2-prob">Ch 2 Problems</label></div>
  </div>

  <h2 style="color:var(--ch3-title);">Ch 3: Bernoulli's Equation</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-ch3-lec1"><label for="p-ch3-lec1">3.1 Bernoulli's Equation I</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch3-lec2"><label for="p-ch3-lec2">3.2 Bernoulli's Equation II</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch3-prob"><label for="p-ch3-prob">Ch 3 Problems</label></div>
  </div>

  <h2 style="color:var(--ch4-title);">Ch 4: Introduction to Fluid Dynamics</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-ch4-lec1"><label for="p-ch4-lec1">4.1 Intro to Fluid Dynamics</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch4-prob"><label for="p-ch4-prob">Ch 4 Problems</label></div>
  </div>

  <h2 style="color:var(--ch5-title);">Ch 5: Reynolds Transport Theorem</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-ch5-lec1"><label for="p-ch5-lec1">5.1 RTT — Mass</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch5-lec2"><label for="p-ch5-lec2">5.2 RTT — Linear Momentum</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch5-lec3"><label for="p-ch5-lec3">5.3 RTT — Angular Momentum</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch5-lec4"><label for="p-ch5-lec4">5.4 RTT — Energy</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch5-prob"><label for="p-ch5-prob">Ch 5 Problems</label></div>
  </div>

  <h2 style="color:var(--ch6-title);">Ch 6: Pipe Flow & Losses</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-ch6-lec1"><label for="p-ch6-lec1">6.1 Pipe Flow Losses I</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch6-lec2"><label for="p-ch6-lec2">6.2 Pipe Flow Losses II</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch6-lec3"><label for="p-ch6-lec3">6.3 Pipe Flow Losses III</label></div>
    <div class="progress-item"><input type="checkbox" id="p-ch6-prob"><label for="p-ch6-prob">Ch 6 Problems</label></div>
  </div>

  <div class="sb-sep" style="margin:20px 0;background:var(--border);"></div>

  <h2 style="color:var(--eq);">Assessments</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-m1"><label for="p-m1">Midterm 1 Prep</label></div>
    <div class="progress-item"><input type="checkbox" id="p-m2"><label for="p-m2">Midterm 2 Prep</label></div>
    <div class="progress-item" style="padding-left:28px;font-size:12px;"><input type="checkbox" id="p-m2-scope"><label for="p-m2-scope">Review scope & format</label></div>
    <div class="progress-item" style="padding-left:28px;font-size:12px;"><input type="checkbox" id="p-m2-bernoulli"><label for="p-m2-bernoulli">Bernoulli problems practiced</label></div>
    <div class="progress-item" style="padding-left:28px;font-size:12px;"><input type="checkbox" id="p-m2-continuity"><label for="p-m2-continuity">Continuity / mass conservation</label></div>
    <div class="progress-item" style="padding-left:28px;font-size:12px;"><input type="checkbox" id="p-m2-linmom"><label for="p-m2-linmom">Linear momentum problems</label></div>
    <div class="progress-item" style="padding-left:28px;font-size:12px;"><input type="checkbox" id="p-m2-angmom"><label for="p-m2-angmom">Angular momentum problems</label></div>
    <div class="progress-item" style="padding-left:28px;font-size:12px;"><input type="checkbox" id="p-m2-traps"><label for="p-m2-traps">Common traps reviewed</label></div>
    <div class="progress-item"><input type="checkbox" id="p-final"><label for="p-final">Final Exam Prep</label></div>
  </div>

  <h2 style="color:var(--tip);">Labs</h2>
  <div class="progress-grid">
    <div class="progress-item"><input type="checkbox" id="p-lab1"><label for="p-lab1">Lab 1: Venturi Meter</label></div>
    <div class="progress-item"><input type="checkbox" id="p-lab2"><label for="p-lab2">Lab 2: Jet Pump</label></div>
    <div class="progress-item"><input type="checkbox" id="p-lab3"><label for="p-lab3">Lab 3: Flow Measurement</label></div>
  </div>
</section>
