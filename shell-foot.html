<!-- shell-foot.html — JS + closing tags -->
<script>
/* ── Section Switching ── */
function showSection(sectionId, anchorId) {
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('visible'));
  const target = document.getElementById(sectionId);
  if (target) {
    target.classList.add('visible');
    if (anchorId) {
      const anchor = document.getElementById(anchorId);
      if (anchor) anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
  /* Update active states */
  document.querySelectorAll('.sb-item, .sb-sub').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll(`[onclick*="'${sectionId}'"]`);
  items.forEach(el => el.classList.add('active'));
  /* Re-wire popups when formulas section becomes visible (hidden elements may skip initial wiring) */
  if (sectionId === 'formulas' && window._wireUpVarPopups) window._wireUpVarPopups();
}

/* ── Chapter Expand/Collapse ── */
function toggleChapter(chId) {
  const subs = document.getElementById(chId + '-subs');
  const arrow = document.getElementById(chId + '-arrow');
  if (subs) {
    subs.classList.toggle('open');
    if (arrow) arrow.classList.toggle('open');
  }
}

/* ── Sidebar Toggle ── */
function toggleSidebar() {
  document.body.classList.toggle('sb-closed');
}
function closeMobileSidebar() {
  document.body.classList.add('sb-closed');
}

/* ── Formula Sheet View Toggle ── */
function setFormulaView(view, btn) {
  var el = document.getElementById('formula-content');
  if (el) el.setAttribute('data-view', view);
  document.querySelectorAll('.fs-views button').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
}

/* ── Formula Sheet Variable Popup ── */
(function() {
  var pop = document.getElementById('varpop');
  if (!pop) return;

  function rgbToHex(c) {
    if (!c) return '';
    if (c.charAt(0) === '#') return c.toLowerCase();
    var m = c.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (!m) return c.toLowerCase();
    return '#' + ((1<<24)+(+m[1]<<16)+(+m[2]<<8)+(+m[3])).toString(16).slice(1);
  }

  function wireUpVarPopups() {
    var cards = document.querySelectorAll('#formulas .fs-card[data-vars]');
    var total = 0;
    for (var c = 0; c < cards.length; c++) {
      var card = cards[c];
      var map;
      try { map = JSON.parse(card.getAttribute('data-vars')); } catch(e) { continue; }
      var lookup = {};
      var keys = Object.keys(map);
      for (var k = 0; k < keys.length; k++) {
        var parts = keys[k].split('|');
        var hex = parts[0].toLowerCase();
        if (!lookup[hex]) lookup[hex] = [];
        lookup[hex].push({ sym: parts[1] || '', desc: map[keys[k]] });
      }
      /* Use DOM .style.color property — more reliable than attribute selector */
      var spans = card.querySelectorAll('.katex-html span');
      for (var s = 0; s < spans.length; s++) {
        var el = spans[s];
        /* Try DOM property first, fall back to parsing the attribute (hidden elements) */
        var col = el.style.color;
        var hex;
        if (col) {
          hex = rgbToHex(col);
        } else {
          var raw = el.getAttribute('style') || '';
          var cm = raw.match(/color:\s*(#[0-9a-fA-F]{6})/);
          if (!cm) continue;
          hex = cm[1].toLowerCase();
        }
        if (!lookup[hex]) continue;
        if (el.closest('.vp-click')) continue;
        if (el.classList.contains('frac-line') || el.classList.contains('mrel') || el.classList.contains('mspace')) continue;
        var entries = lookup[hex];
        var txt = el.textContent || '';
        var best = entries[0];
        for (var i = 0; i < entries.length; i++) {
          if (txt.indexOf(entries[i].sym) !== -1) { best = entries[i]; break; }
        }
        el.classList.add('vp-click');
        el.setAttribute('data-desc', best.desc);
        el.title = best.desc;
        total++;
      }
    }
    console.log('[formulas] wireUpVarPopups tagged ' + total + ' variables across ' + cards.length + ' cards');
  }

  document.addEventListener('click', function(e) {
    var el = e.target.closest('.vp-click');
    if (!el) { pop.style.display = 'none'; return; }
    pop.querySelector('.vp-sym').innerHTML = el.innerHTML;
    pop.querySelector('.vp-desc').textContent = el.getAttribute('data-desc') || '';
    pop.style.display = 'block';
    var rect = el.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = rect.left + rect.width / 2 - pw / 2;
    var top = rect.top - ph - 10;
    if (left < 8) left = 8;
    if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    if (top < 8) top = rect.bottom + 10;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  });

  window._wireUpVarPopups = wireUpVarPopups;
})();

/* ── Formula Sheet Search ── */
(function() {
  var input = document.getElementById('fs-search');
  var results = document.getElementById('fs-results');
  if (!input || !results) return;
  var cards = Array.from(document.querySelectorAll('.fs-card'));
  input.addEventListener('input', function() {
    var q = input.value.toLowerCase().trim();
    results.innerHTML = '';
    if (!q) { results.hidden = true; return; }
    cards
      .filter(function(c) {
        return ((c.dataset.name || '') + ' #' + (c.dataset.num || '') + ' ch' + (c.dataset.ch || '') + ' ' + c.textContent).toLowerCase().indexOf(q) !== -1;
      })
      .slice(0, 8)
      .forEach(function(c) {
        var li = document.createElement('li');
        li.textContent = '#' + c.dataset.num + ' — ' + c.dataset.name + ' (Ch ' + c.dataset.ch + ')';
        li.onclick = function() {
          c.scrollIntoView({behavior: 'smooth', block: 'center'});
          c.classList.add('fs-flash');
          setTimeout(function() { c.classList.remove('fs-flash'); }, 1500);
          results.hidden = true;
          input.value = '';
        };
        results.appendChild(li);
      });
    results.hidden = results.children.length === 0;
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.fs-search-wrap')) results.hidden = true;
  });
})();

/* ── Collapsible Sections ── */
document.addEventListener('click', function(e) {
  const toggle = e.target.closest('.collapse-toggle');
  if (toggle) {
    toggle.classList.toggle('open');
    const body = toggle.nextElementSibling;
    if (body && body.classList.contains('collapse-body')) {
      body.classList.toggle('open');
    }
  }
});

/* ── Progress Persistence ── */
function initProgress() {
  const KEY = 'maae2300-progress';
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  document.querySelectorAll('.progress-item input[type="checkbox"]').forEach(cb => {
    if (saved[cb.id]) cb.checked = true;
    cb.addEventListener('change', () => {
      const state = {};
      document.querySelectorAll('.progress-item input[type="checkbox"]').forEach(c => {
        state[c.id] = c.checked;
      });
      localStorage.setItem(KEY, JSON.stringify(state));
      updateProgressBar();
    });
  });
  updateProgressBar();
}
function updateProgressBar() {
  const all = document.querySelectorAll('.progress-item input[type="checkbox"]');
  const checked = document.querySelectorAll('.progress-item input[type="checkbox"]:checked');
  const pct = all.length ? Math.round((checked.length / all.length) * 100) : 0;
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-pct');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = pct + '%';
}

/* ── Assessment Checklist Persistence ── */
function initChecklists() {
  const KEY = 'maae2300-checklists';
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  document.querySelectorAll('input[data-key]').forEach(cb => {
    if (saved[cb.dataset.key]) cb.checked = true;
    cb.addEventListener('change', () => {
      const state = JSON.parse(localStorage.getItem(KEY) || '{}');
      state[cb.dataset.key] = cb.checked;
      localStorage.setItem(KEY, JSON.stringify(state));
    });
  });
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded', function() {
  renderMathInElement(document.body, {
    delimiters: [
      { left: '\\[', right: '\\]', display: true },
      { left: '\\(', right: '\\)', display: false }
    ],
    trust: true,
    strict: false
  });
  /* Wire up clickable variable popups after KaTeX has rendered colored spans */
  if (window._wireUpVarPopups) window._wireUpVarPopups();
  initProgress();
  initChecklists();
  /* Show summary as landing page */
  showSection('summary');
});
</script>
<div id="varpop"><div class="vp-sym"></div><div class="vp-desc"></div></div>
</body>
</html>
